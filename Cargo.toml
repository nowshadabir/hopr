[package]
name = "hopr"
version = "1.4.4"
edition = "2024"

[dependencies]
tao = "0.34"
wry = "0.54"
muda = "0.17"
tray-icon = { version = "0.21", default-features = false }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSBundle", "NSURL", "NSUUID", "NSProcessInfo", "NSRunLoop", "NSDate"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSView"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebsiteDataStore", "WKWebView", "WKUserContentController"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAPublicDefines"] }

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
