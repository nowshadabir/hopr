[package]
name = "hopr"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.34"
wry = "0.54"
muda = "0.17"
tray-icon = { version = "0.21", default-features = false }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
directories = "6.0"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSWorkspace"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
