<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hopr Header</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --border: rgba(0, 0, 0, 0.08);
      --text: #181a18;
      --muted: #6e726d;
      --pill-active-bg: #dff2e7;
      --pill-active-fg: #0d5c3e;
      --pill-bg-bg: #fef3c7;
      --pill-bg-fg: #92400e;
      --pill-sleep-bg: #e5e7eb;
      --pill-sleep-fg: #4b5563;
      --btn-bg: #ffffff;
      --btn-border: rgba(0, 0, 0, 0.14);
      --btn-hover: #f1efe8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1e1c;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f2f2ee;
        --muted: #9ca09a;
        --pill-active-bg: rgba(37, 211, 102, 0.18);
        --pill-active-fg: #6ee7b7;
        --pill-bg-bg: rgba(245, 158, 11, 0.18);
        --pill-bg-fg: #fcd34d;
        --pill-sleep-bg: rgba(255, 255, 255, 0.1);
        --pill-sleep-fg: #9ca3af;
        --btn-bg: #272a27;
        --btn-border: rgba(255, 255, 255, 0.14);
        --btn-hover: #323632;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }

    .topbar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #135d43;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .status-active {
      background: var(--pill-active-bg);
      color: var(--pill-active-fg);
    }

    .status-background {
      background: var(--pill-bg-bg);
      color: var(--pill-bg-fg);
    }

    .status-hibernated {
      background: var(--pill-sleep-bg);
      color: var(--pill-sleep-fg);
    }

    .right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .policy-text {
      font-size: 12px;
      color: var(--muted);
    }

    .sleep-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .sleep-btn:hover {
      background: var(--btn-hover);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="left">
      <div id="avatar" class="avatar"></div>
      <div class="meta">
        <div class="name-row">
          <span id="acct-name" class="name">Hopr</span>
          <span id="status-pill" class="status-pill status-active">Active</span>
        </div>
        <div id="acct-sub" class="sub">Personal</div>
      </div>
    </div>
    <div class="right">
      <span id="policy-text" class="policy-text"></span>
      <button id="sleep-btn" class="sleep-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span id="sleep-btn-label">Sleep now</span>
      </button>
    </div>
  </div>

  <script>
    const post = (payload) => {
      try {
        window.webkit.messageHandlers.ipc.postMessage(JSON.stringify(payload));
      } catch (_) {}
    };

    const avatarFallbackSvg = () => `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="rgba(255,255,255,0.88)">
        <circle cx="12" cy="8.5" r="4.2"/>
        <path d="M4.5 20.5c0-3.9 3.35-6.5 7.5-6.5s7.5 2.6 7.5 6.5"/>
      </svg>`;

    let currentId = null;
    let currentLifecycle = "active";

    document.getElementById("sleep-btn").addEventListener("click", () => {
      if (!currentId) return;
      if (currentLifecycle === "hibernated") {
        post({ type: "switch_account", id: currentId });
      } else {
        post({ type: "sleep_current" });
      }
    });

    window.__updateTopbar = (acct) => {
      if (!acct) return;
      currentId = acct.id;
      currentLifecycle = acct.lifecycle || "active";

      const avatar = document.getElementById("avatar");
      avatar.style.backgroundColor = acct.color || "#135D43";
      if (acct.avatar_url) {
        avatar.innerHTML = `<img src="${acct.avatar_url}" alt="" />`;
      } else {
        avatar.innerHTML = avatarFallbackSvg();
      }

      document.getElementById("acct-name").textContent = acct.name;
      const subParts = [acct.label];
      if (acct.phone) subParts.push(acct.phone);
      else if (acct.connection_state === "qr") subParts.push("Scan QR code to link");
      document.getElementById("acct-sub").textContent = subParts.filter(Boolean).join(" · ");

      const pill = document.getElementById("status-pill");
      pill.className = `status-pill status-${currentLifecycle}`;
      pill.textContent =
        currentLifecycle === "active"
          ? "Active"
          : currentLifecycle === "background"
          ? "Background"
          : "Sleeping";

      document.getElementById("policy-text").textContent = acct.sleep_summary || "";
      document.getElementById("sleep-btn-label").textContent =
        currentLifecycle === "hibernated" ? "Wake now" : "Sleep now";
    };
  </script>
</body>
</html>
