name: Windows Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional exact Rust test name to run in isolation
        required: false
        type: string

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Run unit tests
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HOPR_TEST_FILTER)) {
            cargo test -- --test-threads=1 --nocapture
          } else {
            cargo test "$env:HOPR_TEST_FILTER" -- --exact --test-threads=1 --nocapture
          }
        env:
          HOPR_DATA_DIR: ${{ runner.temp }}\hopr-test-data
          HOPR_TEST_FILTER: ${{ inputs.test_filter }}
